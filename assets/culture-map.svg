<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Culture design five levers infographic"><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#143d2b" flood-opacity=".10"/></filter></defs><rect width="1200" height="1500" rx="38" fill="#f7f5ee"/><path d="M0 0h220Q110 170 0 260z" fill="#0e4c34"/><circle cx="1110" cy="120" r="180" fill="#e5ead8"/><g font-family="Arial, sans-serif"><rect x="90" y="55" width="245" height="46" rx="23" fill="#0e4c34"/><text x="118" y="86" font-size="24" fill="#fff" font-weight="700">04 — Culture Design</text><text x="90" y="170" font-size="62" fill="#0c3f2d" font-weight="800">Culture เปลี่ยนได้</text><text x="90" y="238" font-size="62" fill="#0c3f2d" font-weight="800">เมื่อผู้นำ ระบบ และสภาพแวดล้อม</text><text x="90" y="306" font-size="62" fill="#0c3f2d" font-weight="800">ไปทางเดียวกัน</text><text x="92" y="355" font-size="21" fill="#58665e">วัฒนธรรมเกิดจากพฤติกรรมที่ทำซ้ำ ระบบที่ออกแบบไว้ และสัญญาณที่องค์กรส่งทุกวัน</text></g><g filter="url(#s)"><rect x="55" y="410" width="1090" height="400" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="420" y="458" font-size="30" fill="#0e4c34" font-weight="800">1 · 5 levers for culture</text><g transform="translate(70 495)"><rect width="205" height="265" rx="22" fill="#f4f6ef"/><circle cx="38" cy="36" r="22" fill="#0e4c34"/><text x="28" y="43" font-size="16" fill="#fff" font-weight="700">01</text><text x="20" y="92" font-size="25" font-weight="800" fill="#0e4c34">Leader</text><text x="20" y="122" font-size="25" font-weight="800" fill="#0e4c34">Behaviour</text><text x="20" y="168" font-size="16" fill="#617069">ผู้นำคือสัญญาณที่</text><text x="20" y="194" font-size="16" fill="#617069">ทรงพลังที่สุดของ Culture</text></g><g transform="translate(287 495)"><rect width="205" height="265" rx="22" fill="#f4f6ef"/><circle cx="38" cy="36" r="22" fill="#0e4c34"/><text x="28" y="43" font-size="16" fill="#fff" font-weight="700">02</text><text x="20" y="92" font-size="23" font-weight="800" fill="#0e4c34">Symbols /</text><text x="20" y="122" font-size="23" font-weight="800" fill="#0e4c34">Slogan / Rituals</text><text x="20" y="168" font-size="16" fill="#617069">ย้ำสิ่งที่องค์กรให้คุณค่า</text><text x="20" y="194" font-size="16" fill="#617069">ผ่านภาษาและพิธีกรรม</text></g><g transform="translate(504 495)"><rect width="205" height="265" rx="22" fill="#f4f6ef"/><circle cx="38" cy="36" r="22" fill="#0e4c34"/><text x="28" y="43" font-size="16" fill="#fff" font-weight="700">03</text><text x="20" y="92" font-size="25" font-weight="800" fill="#0e4c34">People</text><text x="20" y="122" font-size="25" font-weight="800" fill="#0e4c34">Practices</text><text x="20" y="168" font-size="16" fill="#617069">สรรหา พัฒนา Feedback</text><text x="20" y="194" font-size="16" fill="#617069">ประเมินและให้รางวัลให้สอดคล้อง</text></g><g transform="translate(721 495)"><rect width="205" height="265" rx="22" fill="#f4f6ef"/><circle cx="38" cy="36" r="22" fill="#0e4c34"/><text x="28" y="43" font-size="16" fill="#fff" font-weight="700">04</text><text x="20" y="92" font-size="22" font-weight="800" fill="#0e4c34">Business</text><text x="20" y="122" font-size="22" font-weight="800" fill="#0e4c34">Operational Process</text><text x="20" y="168" font-size="16" fill="#617069">Process กำหนดว่า</text><text x="20" y="194" font-size="16" fill="#617069">พฤติกรรมอะไรเกิดขึ้นจริง</text></g><g transform="translate(938 495)"><rect width="205" height="265" rx="22" fill="#f4f6ef"/><circle cx="38" cy="36" r="22" fill="#0e4c34"/><text x="28" y="43" font-size="16" fill="#fff" font-weight="700">05</text><text x="20" y="92" font-size="21" font-weight="800" fill="#0e4c34">Environment &amp;</text><text x="20" y="122" font-size="21" font-weight="800" fill="#0e4c34">Infrastructure</text><text x="20" y="168" font-size="16" fill="#617069">สภาพแวดล้อมส่งสัญญาณ</text><text x="20" y="194" font-size="16" fill="#617069">ว่าอะไรสำคัญและทำได้จริง</text></g></g><g filter="url(#s)"><rect x="55" y="840" width="1090" height="190" rx="34" fill="#eef2e5"/></g><g font-family="Arial, sans-serif"><text x="90" y="892" font-size="28" fill="#0e4c34" font-weight="800">2 · แก่นสำคัญ</text><text x="280" y="935" font-size="48" fill="#0c3f2d" font-weight="800">Know it all → Learn it all</text><text x="282" y="978" font-size="20" fill="#58665e">เปลี่ยนจาก “ฉันรู้หมดแล้ว” ไปสู่ “ฉันพร้อมเรียนรู้เสมอ” เพื่อสร้าง Growth Mindset</text></g><g filter="url(#s)"><rect x="55" y="1060" width="1090" height="205" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="1112" font-size="30" fill="#0e4c34" font-weight="800">3 · สัญญาณที่องค์กรส่งทุกวัน</text><g transform="translate(82 1140)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="20" font-weight="800" fill="#0e4c34">ผู้นำตอบสนองอย่างไร</text><text x="20" y="66" font-size="16" fill="#617069">วิธีฟัง ตัดสินใจ และแก้ปัญหา</text></g><g transform="translate(345 1140)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="20" font-weight="800" fill="#0e4c34">อะไรได้รับการยกย่อง</text><text x="20" y="66" font-size="16" fill="#617069">สิ่งที่ให้รางวัลจะเกิดมากขึ้น</text></g><g transform="translate(608 1140)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="20" font-weight="800" fill="#0e4c34">ประชุมและร่วมงานแบบไหน</text><text x="20" y="66" font-size="16" fill="#617069">รูปแบบทำงานสะท้อนค่านิยม</text></g><g transform="translate(871 1140)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="20" font-weight="800" fill="#0e4c34">ระบบทำให้อะไรง่ายหรือยาก</text><text x="20" y="66" font-size="16" fill="#617069">สิ่งที่ออกแบบไว้กำหนดพฤติกรรม</text></g></g><g filter="url(#s)"><rect x="55" y="1295" width="1090" height="135" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="1347" font-size="30" fill="#0e4c34" font-weight="800">4 · เอาไปใช้ในงาน</text><text x="92" y="1390" font-size="19" fill="#53635a">เริ่มที่พฤติกรรมผู้นำ · เสริมด้วยพิธีกรรมและสัญลักษณ์ · Align People Practices · ออกแบบ Process และ Environment ให้เอื้อ</text></g><rect x="90" y="1450" width="1020" height="32" rx="16" fill="#0e4c34"/></svg>