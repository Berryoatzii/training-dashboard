<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Gamification Motivation Action Feedback infographic"><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#143d2b" flood-opacity=".10"/></filter></defs><rect width="1200" height="1500" rx="38" fill="#f7f5ee"/><path d="M0 0h220Q110 170 0 260z" fill="#0e4c34"/><circle cx="1100" cy="120" r="180" fill="#e4ead4"/><g font-family="Arial, sans-serif"><rect x="90" y="55" width="250" height="46" rx="23" fill="#0e4c34"/><text x="118" y="86" font-size="24" fill="#fff" font-weight="700">01 — Gamification</text><text x="90" y="185" font-size="66" fill="#0c3f2d" font-weight="800">Gamification ไม่ใช่แค่ให้แต้ม</text><text x="92" y="235" font-size="22" fill="#58665e">เครื่องมือเพื่อกระตุ้นให้คนอยากเริ่ม อยากไปต่อ และเห็นความก้าวหน้า</text></g><g filter="url(#s)"><rect x="55" y="300" width="1090" height="790" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><rect x="88" y="330" width="330" height="58" rx="20" fill="#6a9b5f"/><rect x="435" y="330" width="330" height="58" rx="20" fill="#477f53"/><rect x="782" y="330" width="330" height="58" rx="20" fill="#1e6647"/><text x="175" y="369" font-size="30" fill="#fff" font-weight="700">Motivation</text><text x="545" y="369" font-size="30" fill="#fff" font-weight="700">Action</text><text x="880" y="369" font-size="30" fill="#fff" font-weight="700">Feedback</text><text x="420" y="368" font-size="34" fill="#0e4c34">→</text><text x="768" y="368" font-size="34" fill="#0e4c34">→</text></g><g font-family="Arial, sans-serif" font-size="20" fill="#133c2c"><g transform="translate(88 430)"><rect width="310" height="130" rx="22" fill="#f4f6ef" stroke="#e1e4db"/><text x="24" y="38" font-weight="700">Signpost</text><text x="24" y="72" fill="#617069">ชี้ทางเลือกถัดไปให้ชัดเจน</text></g><g transform="translate(88 575)"><rect width="310" height="130" rx="22" fill="#f4f6ef" stroke="#e1e4db"/><text x="24" y="38" font-weight="700">Surprise &amp; Curiosity</text><text x="24" y="72" fill="#617069">สร้างความสงสัยและอยากรู้</text></g><g transform="translate(88 720)"><rect width="310" height="130" rx="22" fill="#f4f6ef" stroke="#e1e4db"/><text x="24" y="38" font-weight="700">Story &amp; Narrative</text><text x="24" y="72" fill="#617069">ทำให้ task เชื่อมเป็นเรื่องเดียว</text></g><g transform="translate(88 865)"><rect width="310" height="130" rx="22" fill="#f4f6ef" stroke="#e1e4db"/><text x="24" y="38" font-weight="700">Countdown Timer</text><text x="24" y="72" fill="#617069">สร้างจังหวะและความเร่งด่วน</text></g></g><g font-family="Arial, sans-serif" fill="#123a2a"><g transform="translate(440 430)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="18" y="38" font-size="18" font-weight="700">Branching</text><text x="18" y="62" font-size="18">Choice</text></g><g transform="translate(600 430)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="18" y="38" font-size="18" font-weight="700">Collect</text><text x="18" y="62" font-size="18">&amp; Trade</text></g><g transform="translate(440 540)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="18" y="52" font-size="18" font-weight="700">Competition</text></g><g transform="translate(600 540)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="48" y="52" font-size="18" font-weight="700">PvP</text></g><g transform="translate(440 650)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="18" y="52" font-size="17" font-weight="700">Customization</text></g><g transform="translate(600 650)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="40" y="52" font-size="18" font-weight="700">Avatar</text></g><g transform="translate(440 760)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="42" y="52" font-size="18" font-weight="700">Team</text></g><g transform="translate(600 760)"><rect width="145" height="94" rx="18" fill="#f4f6ef"/><text x="30" y="52" font-size="18" font-weight="700">High Five</text></g><g transform="translate(440 870)"><rect width="305" height="125" rx="20" fill="#e9efdf"/><text x="35" y="38" font-size="19" font-weight="700">Mission / Quest / Challenge</text><text x="35" y="74" font-size="17">Boss Battle · Side Quest</text><text x="35" y="100" font-size="17">Protector · Daily / Weekly Quest</text></g></g><g font-family="Arial, sans-serif" fill="#123a2a"><g transform="translate(788 430)"><rect width="315" height="105" rx="20" fill="#f4f6ef"/><text x="22" y="40" font-size="21" font-weight="700">Point</text><text x="22" y="72" font-size="18" fill="#617069">ให้คะแนน / สะสมแต้ม</text></g><g transform="translate(788 550)"><rect width="315" height="105" rx="20" fill="#f4f6ef"/><text x="22" y="40" font-size="21" font-weight="700">Leaderboard</text><text x="22" y="72" font-size="18" fill="#617069">จัดอันดับ / เปรียบเทียบ</text></g><g transform="translate(788 670)"><rect width="315" height="105" rx="20" fill="#f4f6ef"/><text x="22" y="40" font-size="21" font-weight="700">Level</text><text x="22" y="72" font-size="18" fill="#617069">ปลดล็อกระดับใหม่</text></g><g transform="translate(788 790)"><rect width="315" height="105" rx="20" fill="#f4f6ef"/><text x="22" y="40" font-size="21" font-weight="700">Progress Bar / Streak</text><text x="22" y="72" font-size="18" fill="#617069">เห็นความคืบหน้าและความต่อเนื่อง</text></g><g transform="translate(788 910)"><rect width="315" height="120" rx="20" fill="#e9efdf"/><text x="22" y="36" font-size="21" font-weight="700">Rewards</text><text x="22" y="66" font-size="17" fill="#617069">ไม่จำเป็นต้องเป็นของเสมอไป</text><text x="22" y="96" font-size="18">Status · Access · Power</text></g></g><g filter="url(#s)"><rect x="55" y="1140" width="1090" height="250" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><rect x="85" y="1168" width="310" height="52" rx="22" fill="#0e4c34"/><text x="112" y="1203" font-size="25" fill="#fff" font-weight="700">วิธีเลือกใช้แบบง่าย</text><g transform="translate(95 1250)"><rect width="310" height="105" rx="22" fill="#f4f6ef"/><text x="28" y="42" font-size="22" font-weight="700" fill="#0c3f2d">ยังไม่อยากเริ่ม</text><text x="28" y="75" font-size="18" fill="#617069">เริ่มที่ Motivation</text></g><g transform="translate(445 1250)"><rect width="310" height="105" rx="22" fill="#f4f6ef"/><text x="28" y="42" font-size="22" font-weight="700" fill="#0c3f2d">ยังไม่ลงมือ</text><text x="28" y="75" font-size="18" fill="#617069">ปรับ Action ให้ชัดและเล่นง่ายขึ้น</text></g><g transform="translate(795 1250)"><rect width="310" height="105" rx="22" fill="#f4f6ef"/><text x="28" y="42" font-size="22" font-weight="700" fill="#0c3f2d">ทำแล้วไม่รู้สึกคืบหน้า</text><text x="28" y="75" font-size="18" fill="#617069">เติม Feedback ให้เห็นความก้าวหน้า</text></g></g><rect x="90" y="1420" width="1020" height="52" rx="26" fill="#e8eedf"/><text x="190" y="1454" font-family="Arial, sans-serif" font-size="20" fill="#315743">ออกแบบอย่างมีเป้าหมาย ให้เครื่องมือทำงานร่วมกัน เพื่อพฤติกรรมที่ยั่งยืน</text></svg>