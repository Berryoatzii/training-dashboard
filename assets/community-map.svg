<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Internal Community GANG framework infographic"><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#143d2b" flood-opacity=".10"/></filter></defs><rect width="1200" height="1500" rx="38" fill="#f7f5ee"/><path d="M0 0h220Q110 170 0 260z" fill="#0e4c34"/><circle cx="1110" cy="120" r="180" fill="#e5ead8"/><g font-family="Arial, sans-serif"><rect x="90" y="55" width="300" height="46" rx="23" fill="#0e4c34"/><text x="118" y="86" font-size="24" fill="#fff" font-weight="700">02 — Internal Community</text><text x="90" y="170" font-size="62" fill="#0c3f2d" font-weight="800">Community ที่ดี</text><text x="90" y="238" font-size="62" fill="#0c3f2d" font-weight="800">ไม่ได้เริ่มจากกิจกรรม</text><text x="90" y="306" font-size="62" fill="#0c3f2d" font-weight="800">แต่เริ่มจากเหตุผลร่วม</text><text x="92" y="355" font-size="21" fill="#58665e">พาคนจาก “เข้าร่วม” ไปสู่ “มีส่วนร่วม” และร่วมกันสร้างผลลัพธ์ที่มีความหมาย</text></g><g filter="url(#s)"><rect x="55" y="410" width="1090" height="330" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="462" font-size="30" fill="#0e4c34" font-weight="800">1 · GANG Framework</text><g transform="translate(82 500)"><rect width="245" height="195" rx="24" fill="#f0efd8"/><circle cx="50" cy="52" r="30" fill="#d9a92e"/><text x="39" y="63" font-size="34" font-weight="800" fill="#0e4c34">G</text><text x="92" y="60" font-size="27" font-weight="800" fill="#0e4c34">Ground</text><text x="28" y="112" font-size="18" fill="#53635a">Give people a reason</text><text x="28" y="140" font-size="18" fill="#53635a">to gather</text><text x="28" y="174" font-size="16" fill="#53635a">สร้างเหตุผลที่ดีพอให้คนอยากรวมกัน</text></g><g transform="translate(345 500)"><rect width="245" height="195" rx="24" fill="#e9efe1"/><circle cx="50" cy="52" r="30" fill="#3b7348"/><text x="39" y="63" font-size="34" font-weight="800" fill="#fff">A</text><text x="92" y="60" font-size="27" font-weight="800" fill="#0e4c34">Activate</text><text x="28" y="112" font-size="18" fill="#53635a">Create reasons</text><text x="28" y="140" font-size="18" fill="#53635a">to participate</text><text x="28" y="174" font-size="16" fill="#53635a">ออกแบบเหตุผลและโอกาสให้มีส่วนร่วม</text></g><g transform="translate(608 500)"><rect width="245" height="195" rx="24" fill="#e9efe1"/><circle cx="50" cy="52" r="30" fill="#3b7348"/><text x="39" y="63" font-size="34" font-weight="800" fill="#fff">N</text><text x="92" y="60" font-size="27" font-weight="800" fill="#0e4c34">Nurture</text><text x="28" y="112" font-size="18" fill="#53635a">Turn participation</text><text x="28" y="140" font-size="18" fill="#53635a">into contribution</text><text x="28" y="174" font-size="16" fill="#53635a">เปลี่ยนการมีส่วนร่วมให้เป็นการลงมือทำ</text></g><g transform="translate(871 500)"><rect width="245" height="195" rx="24" fill="#e9efe1"/><circle cx="50" cy="52" r="30" fill="#3b7348"/><text x="39" y="63" font-size="34" font-weight="800" fill="#fff">G</text><text x="92" y="60" font-size="27" font-weight="800" fill="#0e4c34">Grow</text><text x="28" y="112" font-size="18" fill="#53635a">Turn community</text><text x="28" y="140" font-size="18" fill="#53635a">into impact</text><text x="28" y="174" font-size="16" fill="#53635a">ขยายพลัง Community ให้เกิดผลกับองค์กร</text></g></g><g filter="url(#s)"><rect x="55" y="770" width="1090" height="250" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="822" font-size="30" fill="#0e4c34" font-weight="800">2 · เส้นทางของ Community ที่เติบโตอย่างมีความหมาย</text><g fill="#0e4c34" font-weight="800" font-size="24"><text x="110" y="905">Gathering</text><text x="380" y="905">Participation</text><text x="680" y="905">Ownership</text><text x="960" y="905">Impact</text></g><g fill="#617069" font-size="17"><text x="92" y="940">รวมคนที่มีเหตุผลร่วมกัน</text><text x="350" y="940">สร้างพื้นที่ให้คนมีส่วนร่วม</text><text x="660" y="940">เกิดความรู้สึกเป็นเจ้าของ</text><text x="915" y="940">สร้างผลลัพธ์ที่มีความหมาย</text></g><path d="M230 890h100M540 890h100M830 890h90" stroke="#6f956c" stroke-width="6" stroke-dasharray="10 10"/><path d="M320 880l18 10-18 10M630 880l18 10-18 10M910 880l18 10-18 10" fill="none" stroke="#6f956c" stroke-width="6"/></g><g filter="url(#s)"><rect x="55" y="1050" width="1090" height="205" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="1102" font-size="30" fill="#0e4c34" font-weight="800">3 · สิ่งที่ชวนคิดเวลาออกแบบ Community</text><g transform="translate(82 1130)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="21" font-weight="800" fill="#0e4c34">Why join?</text><text x="20" y="66" font-size="16" fill="#617069">เหตุผลอะไรดีพอให้คนอยากเข้ามา</text></g><g transform="translate(345 1130)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="21" font-weight="800" fill="#0e4c34">Why stay?</text><text x="20" y="66" font-size="16" fill="#617069">อะไรทำให้เขารู้สึกว่าที่นี่มีคุณค่า</text></g><g transform="translate(608 1130)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="21" font-weight="800" fill="#0e4c34">Why share?</text><text x="20" y="66" font-size="16" fill="#617069">อะไรทำให้เขาอยากแบ่งปันและช่วยกัน</text></g><g transform="translate(871 1130)"><rect width="240" height="90" rx="20" fill="#f4f6ef"/><text x="20" y="36" font-size="21" font-weight="800" fill="#0e4c34">Why lead?</text><text x="20" y="66" font-size="16" fill="#617069">เราจะเปิดทางให้เขาก้าวขึ้นมานำอย่างไร</text></g></g><g filter="url(#s)"><rect x="55" y="1285" width="1090" height="155" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="1335" font-size="30" fill="#0e4c34" font-weight="800">4 · เอาไปใช้ในงาน</text><text x="95" y="1385" font-size="19" fill="#53635a">เริ่มจากเป้าหมายที่ชัด · สร้างจังหวะการมีส่วนร่วม · ยกย่องผู้มีส่วนร่วม · ออกแบบเส้นทางสู่การเป็นเจ้าของ</text></g><rect x="90" y="1452" width="1020" height="32" rx="16" fill="#0e4c34"/></svg>