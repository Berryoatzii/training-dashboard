<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Nudge EAST infographic"><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#143d2b" flood-opacity=".10"/></filter></defs><rect width="1200" height="1500" rx="38" fill="#f7f5ee"/><path d="M0 0h220Q110 170 0 260z" fill="#0e4c34"/><circle cx="1110" cy="120" r="180" fill="#e5ead8"/><g font-family="Arial, sans-serif"><rect x="90" y="55" width="250" height="46" rx="23" fill="#0e4c34"/><text x="118" y="86" font-size="24" fill="#fff" font-weight="700">03 — Nudge / EAST</text><text x="90" y="175" font-size="64" fill="#0c3f2d" font-weight="800">อยากให้คนทำพฤติกรรมที่ต้องการ</text><text x="90" y="243" font-size="64" fill="#0c3f2d" font-weight="800">ให้ทำง่ายขึ้น</text><text x="92" y="292" font-size="21" fill="#58665e">ออกแบบทางเลือกและสภาพแวดล้อม เพื่อให้คนตัดสินใจและทำพฤติกรรมได้ง่ายขึ้น</text></g><g filter="url(#s)"><rect x="55" y="345" width="1090" height="325" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="398" font-size="30" fill="#0e4c34" font-weight="800">1 · EAST Framework</text><g transform="translate(112 445)"><g transform="translate(0 0) rotate(45 100 100)"><rect x="30" y="30" width="140" height="140" rx="28" fill="#e7eddc"/></g><text x="55" y="110" font-size="30" font-weight="800" fill="#0e4c34">Easy</text><text x="46" y="145" font-size="18" fill="#617069">ลดขั้นตอน</text><text x="46" y="171" font-size="18" fill="#617069">ลดความฝืด</text></g><g transform="translate(365 445)"><g transform="translate(0 0) rotate(45 100 100)"><rect x="30" y="30" width="140" height="140" rx="28" fill="#e7eddc"/></g><text x="25" y="110" font-size="30" font-weight="800" fill="#0e4c34">Attractive</text><text x="35" y="145" font-size="18" fill="#617069">ทำให้น่าสนใจ</text><text x="35" y="171" font-size="18" fill="#617069">และชวนเริ่ม</text></g><g transform="translate(620 445)"><g transform="translate(0 0) rotate(45 100 100)"><rect x="30" y="30" width="140" height="140" rx="28" fill="#e7eddc"/></g><text x="50" y="110" font-size="30" font-weight="800" fill="#0e4c34">Social</text><text x="32" y="145" font-size="18" fill="#617069">ใช้แรงของสังคม</text><text x="32" y="171" font-size="18" fill="#617069">และตัวอย่างจากคนอื่น</text></g><g transform="translate(875 445)"><g transform="translate(0 0) rotate(45 100 100)"><rect x="30" y="30" width="140" height="140" rx="28" fill="#e7eddc"/></g><text x="38" y="110" font-size="30" font-weight="800" fill="#0e4c34">Timely</text><text x="25" y="145" font-size="18" fill="#617069">กระตุ้นในจังหวะ</text><text x="25" y="171" font-size="18" fill="#617069">ที่เหมาะ</text></g></g><g filter="url(#s)"><rect x="55" y="700" width="1090" height="230" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="752" font-size="30" fill="#0e4c34" font-weight="800">2 · ถ้าอยากลดพฤติกรรมบางอย่าง</text><g transform="translate(88 790)"><rect width="235" height="100" rx="22" fill="#f4f6ef"/><text x="20" y="40" font-size="21" font-weight="800" fill="#0e4c34">Make it Hard</text><text x="20" y="72" font-size="17" fill="#617069">ทำให้ยากขึ้น / เพิ่มขั้นตอน</text></g><g transform="translate(350 790)"><rect width="235" height="100" rx="22" fill="#f4f6ef"/><text x="20" y="40" font-size="20" font-weight="800" fill="#0e4c34">Make it Unattractive</text><text x="20" y="72" font-size="17" fill="#617069">ทำให้น่าสนใจน้อยลง</text></g><g transform="translate(612 790)"><rect width="235" height="100" rx="22" fill="#f4f6ef"/><text x="20" y="40" font-size="19" font-weight="800" fill="#0e4c34">Social Pressure</text><text x="20" y="72" font-size="17" fill="#617069">ใช้แรงกดดันทางสังคม</text></g><g transform="translate(874 790)"><rect width="235" height="100" rx="22" fill="#f4f6ef"/><text x="20" y="40" font-size="21" font-weight="800" fill="#0e4c34">Make it Delayed</text><text x="20" y="72" font-size="17" fill="#617069">หน่วงเวลา / ชะลอการตัดสินใจ</text></g></g><g filter="url(#s)"><rect x="55" y="960" width="1090" height="235" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="1012" font-size="30" fill="#0e4c34" font-weight="800">3 · วิธีคิดก่อนออกแบบ</text><g transform="translate(88 1050)"><rect width="310" height="105" rx="22" fill="#f4f6ef"/><text x="26" y="42" font-size="22" font-weight="800" fill="#0e4c34">อยากให้คนทำอะไร?</text><text x="26" y="76" font-size="17" fill="#617069">กำหนดพฤติกรรมเป้าหมายให้ชัดเจน</text></g><g transform="translate(445 1050)"><rect width="310" height="105" rx="22" fill="#f4f6ef"/><text x="26" y="42" font-size="22" font-weight="800" fill="#0e4c34">ติดตรงไหน?</text><text x="26" y="76" font-size="17" fill="#617069">อะไรทำให้ยาก ลืม ไม่เข้าใจ หรือไม่อยากทำ</text></g><g transform="translate(802 1050)"><rect width="310" height="105" rx="22" fill="#f4f6ef"/><text x="26" y="42" font-size="22" font-weight="800" fill="#0e4c34">จะปรับอะไร?</text><text x="26" y="76" font-size="17" fill="#617069">ทางเลือก ขั้นตอน หรือสภาพแวดล้อม</text></g></g><g filter="url(#s)"><rect x="55" y="1225" width="1090" height="185" rx="34" fill="#fff"/></g><g font-family="Arial, sans-serif"><text x="90" y="1277" font-size="30" fill="#0e4c34" font-weight="800">4 · เอาไปใช้กับงาน</text><text x="92" y="1325" font-size="20" fill="#53635a">ลดความฝืดของฟอร์ม · ทำให้ next step ชัด · ใช้ social proof · ส่ง reminder ในจังหวะที่เหมาะ</text><rect x="90" y="1355" width="1020" height="32" rx="16" fill="#e7eddc"/><text x="270" y="1379" font-size="17" fill="#315743">หลักสำคัญ: เป้าหมายไม่ใช่การบังคับ แต่คือการออกแบบให้ “ทำง่ายขึ้น”</text></g><rect x="90" y="1450" width="1020" height="32" rx="16" fill="#0e4c34"/></svg>