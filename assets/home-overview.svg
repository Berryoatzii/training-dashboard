" font-size="31" font-weight="800">Community</text><text x="372" y="485" font-size="18" fill="#5e6a63">เข้าร่วม → มีส่วนร่วม</text><text x="372" y="513" font-size="18" fill="#5e6a63">→ เป็นเจ้าของ</text><g fill="#5b8a62"><circle cx="430" cy="570" r="22"/><circle cx="500" cy="570" r="22"/><circle cx="465" cy="535" r="22"/></g><path d="M420 610q45-45 90 0" fill="none" stroke="#0f5138" stroke-width="8"/><circle cx="650" cy="330" r="24" fill="#0f5138"/><text x="642" y="338" font-size="18" fill="#fff" font-weight="700">03</text><text x="642" y="420" font-size="34" font-weight="800">Nudge / EAST</text><text x="642" y="462" font-size="18" fill="#5e6a63">Easy • Attractive • Social</text><text x="642" y="490" font-size="18" fill="#5e6a63">• Timely</text><g transform="translate(735 555) rotate(45)"><rect x="-35" y="-35" width="70" height="70" rx="14" fill="#dfe8cf" stroke="#0f5138" stroke-width="4"/></g><circle cx="920" cy="330" r="24" fill="#0f5138"/><text x="912" y="338" font-size="18" fill="#fff" font-weight="700">04</text><text x="912" y="420" font-size="34" font-weight="800">Culture Design</text><text x="912" y="462" font-size="18" fill="#5e6a63">ผู้นำ • ระบบ • วิธีทำงาน</text><text x="912" y="490" font-size="18" fill="#5e6a63">• สภาพแวดล้อม</text><g fill="none" stroke="#0f5138" stroke-width="8"><circle cx="1000" cy="560" r="34"/><path d="M1000 510v-25M1000 635v-25M950 560h-25M1075 560h-25M965 525l-18-18M1053 613l-18-18M1035 525l18-18M947 613l18-18"/></g></g><rect x="70" y="690" width="1060" height="70" rx="28" fill="#0f5138"/><g font-family="Arial, sans-serif" fill="#f7f5ee" font-size="22" font-weight="700"><text x="170" y="734">อ่านง่าย</text><text x="520" y="734">นำไปใช้ได้</text><text x="865" y="734">แบ่งเป็นเรื่อง</text></g></svg>