name: Deploy Behavior Design Notes to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "behavior-design-notes/**"
      - ".github/workflows/behavior-design-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./behavior-design-notes
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
